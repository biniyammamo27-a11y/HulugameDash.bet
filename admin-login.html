<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hulugame.bet - Admin Login</title>
    <style>
        body { background-color: #0b0f19; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #161b26; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 100%; max-width: 360px; text-align: center; border: 1px solid #232a38; }
        .title-main { font-size: 26px; font-weight: bold; color: #ff4757; margin-bottom: 5px; }
        .title-sub { font-size: 18px; font-weight: 600; color: #ffffff; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #232a38; background: #0f131c; color: white; box-sizing: border-box; font-size: 15px; text-align: center; }
        button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #2ed573; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #26af66; }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="title-main">Hulugame.bet</div>
        <div class="title-sub">የአድሚን መቆጣጠሪያ ፓነል</div>
        <input type="password" id="admin-pass" placeholder="ሚስጥራዊ የይለፍ ቃል ያስገቡ">
        <button onclick="loginAdmin()">ግባ (LOGIN)</button>
    </div>

    <script>
        async function loginAdmin() {
            const password = document.getElementById('admin-pass').value;
            if(!password) return alert("⚠️ እባክዎ መጀመሪያ የይለፍ ቃል ያስገቡ!");

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await response.json();

                if(data.success) {
                    // 🛡️ ለአስተማማኝነት ቶክኑን በ localStorage ላይም ጭምር ሴቭ እናደርገዋለን
                    localStorage.setItem('adminToken', data.token);
                    alert("🟢 በተሳካ ሁኔታ ገብተዋል!");
                    window.location.href = '/admin-panel'; 
                } else {
                    alert(data.message);
                }
            } catch (e) {
                alert("❌ ከሰርቨር ጋር መገናኘት አልተቻለም!");
            }
        }
    </script>
</body>
</html>
